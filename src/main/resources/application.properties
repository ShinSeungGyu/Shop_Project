spring.application.name=shop

#포트 설정
server.port=80

#MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/shop?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=tlstmdrb219@

#쿼리 콘솔 출력
spring.jpa.properties.hibernate.show_sql=true

#출력되는 쿼리를 포맷팅
spring.jpa.properties.hibernate.format_sql=true

#쿼리에 물음표로 출력되는 바인드 파라미터 출력
spring.level.org.hibernate.type.descriptor.sql=trace

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Live Reload 기능 활성화
spring.devtools.livereload.enabled=true

#Thymeleaf cache 사용 중지
spring.thymeleaf.cache = false

#파일 한 개당 최대 사이즈
spring.servlet.multipart.maxFileSize=20MB
#요청당 최대 파일 크기
spring.servlet.multipart.maxRequestSize=100MB
#상품 이미지 업로드 경로
itemImgLocation=C:/shop/item
#리소스 업로드 경로
uploadPath=file:///C:/shop/

# 세션 쿠키가 브라우저 종료 시 삭제되도록 설정 (Max-Age를 지정하지 않음)
server.servlet.session.cookie.max-age=-1
# 쿠키가 생성되는 경로 제한
server.servlet.session.cookie.path=/

#Toss
toss.payments.secretKey=${TOSS_SECRET_API_KEY}
toss.payments.api.url=https://api.tosspayments.com/v1/payments/confirm

# Google OAuth2 설정
spring.security.oauth2.client.registration.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_SECRET_API_KEY}
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.extra-parameters.prompt=select_account


## Kakao OAuth2 설정
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_SECRET_API_KEY}
spring.security.oauth2.client.registration.kakao.client-secret=cenvocCUnYutTycXQshp8y971ISS0ST5
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost/login/oauth2/code/kakao
# 카카오 동의 항목에 따라 scope를 조정해주세요.
spring.security.oauth2.client.registration.kakao.scope=name,account_email
spring.security.oauth2.client.registration.kakao.client-name=kakao
# Kakao OAuth2 Provider 설정
# 카카오의 인증 및 토큰, 사용자 정보 URI는 고정된 값입니다.
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
# 카카오 사용자 정보에서 고유 ID를 나타내는 속성 이름
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Naver OAuth2 설정
# 클라이언트 ID와 Secret은 네이버 개발자 센터에서 발급받으세요.
spring.security.oauth2.client.registration.naver.client-id=${NAVER_SECRET_API_KEY}
spring.security.oauth2.client.registration.naver.client-secret=zI_tneWmQG
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost/login/oauth2/code/naver
# 네이버 동의 항목에 따라 scope를 조정해주세요.
spring.security.oauth2.client.registration.naver.scope=email,profile
spring.security.oauth2.client.registration.naver.client-name=Naver

# Naver OAuth2 Provider 설정
# 네이버의 인증 및 토큰, 사용자 정보 URI는 고정된 값입니다.
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
# 네이버 사용자 정보에서 실제 사용자 데이터가 담겨있는 최상위 키 이름
spring.security.oauth2.client.provider.naver.user-name-attribute=response

server.servlet.session.timeout=1h

#기본 batch size 설정
spring.jpa.properties.hibernate.default_batch_fetch_size=1000