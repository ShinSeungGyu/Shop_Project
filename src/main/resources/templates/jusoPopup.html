<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>주소 찾기 팝업</title>
</head>
<script th:inline="javascript">
  /*<![CDATA[*/
  // opener관련 오류가 발생하는 경우 아래 주석을 해지하고, 사용자의 도메인정보를 입력합니다. ("주소입력화면 소스"도 동일하게 적용시켜야 합니다.)
  //document.domain = "abc.go.kr";

  function init(){
      var url = location.href;
      var confmKey = "devU01TX0FVVEgyMDI1MTIyMjE4NDUxMTExNzM0Njc="; // 승인키 (실제 서비스에서는 본인의 승인키로 변경해야 합니다.)
      var resultType = "4"; // 도로명주소 검색결과 화면 출력유형, 1 : 도로명, 2 : 도로명+지번, 3 : 도로명+상세건물명, 4 : 도로명+지번+상세건물명

      // 컨트롤러에서 모델에 담아 전달받은 inputYn 값을 사용합니다.
      var inputYn = /*[[${inputYn}]]*/ 'N';
      if (inputYn != "Y") {
          document.form.confmKey.value = confmKey;
          document.form.returnUrl.value = url;
          document.form.resultType.value = resultType;
          // 주소 API 팝업 URL. 모바일 웹인 경우 다른 주소를 사용하세요.
          document.form.action="https://business.juso.go.kr/addrlink/addrLinkUrl.do";
          document.form.submit();
      } else {
          /** API 서비스 제공항목 확대 (2017.02) **/
          // 컨트롤러에서 모델에 담아 전달받은 파라미터 값들을 사용합니다.
          opener.jusoCallBack(
              /*[[${roadFullAddr}]]*/ '', /*[[${roadAddrPart1}]]*/ '', /*[[${addrDetail}]]*/ '', /*[[${roadAddrPart2}]]*/ '', /*[[${engAddr}]]*/ '',
              /*[[${jibunAddr}]]*/ '', /*[[${zipNo}]]*/ '', /*[[${admCd}]]*/ '', /*[[${rnMgtSn}]]*/ '', /*[[${bdMgtSn}]]*/ '', /*[[${detBdNmList}]]*/ '',
              /*[[${bdNm}]]*/ '', /*[[${bdKdcd}]]*/ '', /*[[${siNm}]]*/ '', /*[[${sggNm}]]*/ '', /*[[${emdNm}]]*/ '', /*[[${liNm}]]*/ '', /*[[${rn}]]*/ '', /*[[${udrtYn}]]*/ '',
              /*[[${buldMnnm}]]*/ '', /*[[${buldSlno}]]*/ '', /*[[${mtYn}]]*/ '', /*[[${lnbrMnnm}]]*/ '', /*[[${lnbrSlno}]]*/ '', /*[[${emdNo}]]*/ ''
          );
          window.close();
      }
  }
  /*]]>*/
</script>
  <body onload="init();">
    <form id="form" name="form" method="post">
      <input type="hidden" id="confmKey" name="confmKey" value=""/>
      <input type="hidden" id="returnUrl" name="returnUrl" value=""/>
      <input type="hidden" id="resultType" name="resultType" value=""/>
      <!-- 해당시스템의 인코딩타입이 EUC-KR일경우에만 추가 START-->
      <!--
      <input type="hidden" id="encodingType" name="encodingType" value="EUC-KR"/>
       -->
      <!-- 해당시스템의 인코딩타입이 EUC-KR일경우에만 추가 END-->
    </form>
  </body>
</html>
