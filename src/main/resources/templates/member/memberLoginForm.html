<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}" lang="ko">
<head>
  <title>로그인</title>
  <meta charset="UTF-8">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<!-- 사용자 CSS 추가 -->
<th:block layout:fragment="css">
  <style>
    .error {
       color: #bd2130;
    }

    .content {
    margin-top: 80px;
    }

    .form {
    max-width: 400px;
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #ccc;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    .login-text {
    text-align: center;
    margin-top: 5px;
    margin-bottom: 10px;
    }

    .login-btn {
            display: block;
            width: 220px;
            height: 50px;
            overflow: hidden;
            border-radius: 6px;
    }
    .login-btn img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* 이미지 비율이 달라도 지정한 영역에 꽉 채움 */
            display: block;
        }
  </style>
</th:block>

<div layout:fragment="content">
  <form class="form" role="form" method="post" action="/members/login">
    <h2 class="login-text">로그인</h2>
    <div class="form-group">
      <label th:for="email">이메일주소</label>
      <input type="email" name="email" class="form-control" placeholder="이메일을 입력해주세요">
    </div>
    <div class="form-group">
      <label th:for="password">비밀번호</label>
      <input type="password" name="password" id="password" class="form-control" placeholder="비밀번호 입력">
    </div>
    <p th:if="${loginErrorMsg}" class="error" th:text="${loginErrorMsg}"></p>
    <button class="btn btn-primary">로그인</button>
    <button type="button" class="btn btn-primary" onClick="location.href='/members/new'">회원가입</button>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  </form>

  <hr style="margin-top: 30px; margin-bottom: 20px;">
  <div style="text-align: center; margin-bottom: 15px; font-size: 1.1em; color: #555;">또는 다른 방법으로 로그인</div>
  <div style="text-align: center;">
    <!-- Google 로그인 버튼 -->
    <a href="/oauth2/authorization/google" class="btn google-login-btn">
      <div class="login-btn">
        <img th:src="@{/icons/google_login.png}" class="google-icon">
      </div>
    </a>
    <!-- Kakao 로그인 버튼 -->
    <a href="/oauth2/authorization/kakao" class="btn kakao-login-btn">
      <div class="login-btn">
        <img th:src="@{/icons/kakao_login.png}" class="kakao-icon">
      </div>
    </a>
    <!-- Naver 로그인 버튼 -->
    <a href="/oauth2/authorization/naver" class="btn naver-login-btn">
      <div class="login-btn">
        <img th:src="@{/icons/naver_login.png}" class="naver-icon">
      </div>
    </a>
  </div>
</div>
</html>
