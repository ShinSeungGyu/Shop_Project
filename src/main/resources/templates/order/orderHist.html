<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}" lang="ko">
<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<!-- 사용자 스크립트 추가 -->
<th:block layout:fragment="script">
  <script th:inline="javascript">
    function cancelOrder(orderId) {
      var token = $("meta[name='_csrf']").attr("content");
      var header = $("meta[name='_csrf_header']").attr("content");
      var url = "/order/" + orderId + "/cancel";
      var paramData = {
        orderId : orderId,
      };
      var param = JSON.stringify(paramData);

      $.ajax({
                url      : url,
                type     : "POST",
                contentType : "application/json",
                data     : param,
                beforeSend : function(xhr){
                    /* 데이터를 전송하기 전에 헤더에 csrf값을 설정 */
                    xhr.setRequestHeader(header, token);
                },
                dataType : "json",
                cache   : false,
                success  : function(result, status){
                    alert("주문이 취소 되었습니다.");
                    location.href='/orders/' + [[${page}]];
                },
                error : function(jqXHR, status, error){
                    if(jqXHR.status == '401'){
                        alert('로그인 후 이용해주세요');
                        location.href='/members/login';
                    } else{
                        alert(jqXHR.responseText);
                    }
                }
      });
    }

    function openTrackingPopup(courierCode, invoiceNumber) {
      // 1. 팝업창 설정 (가로 500, 세로 800 정도가 적당합니다)
      const width = 500;
      const height = 800;
      const left = (window.screen.width / 2) - (width / 2);
      const top = (window.screen.height / 2) - (height / 2);

      const windowFeatures = `width=${width},height=${height},left=${left},top=${top},scrollbars=yes`;

      // 2. 빈 팝업창을 먼저 띄움 (이름을 'trackingPopup'으로 지정)
      window.open('', 'trackingPopup', windowFeatures);

      // 3. 숨겨진 폼에 값 세팅
      document.getElementById('modal_t_code').value = courierCode;
      document.getElementById('modal_t_invoice').value = invoiceNumber;

      // 4. 폼 전송 (target이 팝업창 이름과 일치하므로 팝업창에 결과가 뜸)
      document.getElementById('trackingForm').submit();
    }
  </script>
</th:block>

<!-- 사용자 CSS 추가 -->
<th:block layout:fragment="css">
  <style>
    .content-mg{
      margin-left : 30%;
      margin-right : 30%;
      margin-top : 2%;
      margin-bottom : 100px;
    }

    .repImgDiv{
      margin-left : 15px;
      margin-right : 15px;
      height:auto;
    }
    .repImg{
      height:100px;
      width:100px;
    }
    .card{
      width:750px;
      height:100%;
      padding:30px;
      margin-bottom:20px;
    }
    .fs18{
      font-size:18px;
    }
    .fs24{
      font-size:24px;
    }
  </style>
</th:block>

<div layout:fragment="content" class="content-mg">
  <h2 class="mb-4">구매 이력</h2>
  <form id="trackingForm" action="https://info.sweettracker.co.kr/tracking/5" method="post" target="trackingPopup">
    <input type="hidden" name="t_key" value="cpM1g0PTTEI7dghvoA7rHw">
    <input type="hidden" name="t_code" id="modal_t_code">
    <input type="hidden" name="t_invoice" id="modal_t_invoice">
  </form>
  <div th:each="order : ${orders.getContent()}">
    <div class="d-flex mb-3 align-self-center">
      <h4 th:text="${order.orderDate} + ' 주문'"></h4>
      <div class="ml-3">
        <th:block th:if="${order.orderStatus == T(com.shop.constant.OrderStatus).ORDER}">
          <!--주문 취소 클릭 시 스크립트 동작-->
          <button type="button" class="btn btn-outline-secondary" th:value="${order.orderId}" onclick="cancelOrder(this.value)">주문취소</button>
        </th:block>
        <th:block th:unless="${order.orderStatus == T(com.shop.constant.OrderStatus).ORDER}">
          <h4>(취소 완료)</h4>
        </th:block>
      </div>
    </div>

    <div class="card d-flex">
      <div th:each="orderItem : ${order.orderItemDtoList}" class="d-flex mb-3">
        <div class="repImgDiv">
          <img th:src="${orderItem.imgUrl}" class="rounded repImg" th:alt="${orderItem.itemNm}">
        </div>
        <div class="align-self-center w-75">
          <span th:text="${orderItem.itemNm}" class="fs24 font-weight-bold"></span>
          <div class="fs18 font-weight-light">
            <span th:text="${orderItem.orderPrice} + '원'"></span>
            <span th:text="${orderItem.count} + '개'"></span>
          </div>
        </div>
      </div>
      <div th:unless="${order.trackingNumber == null}">
        <button type="button"
                class="btn-sm"
                style="cursor:pointer; background-color: #007bff; color: white; border: none; border-radius: 3px;"
                th:onclick="openTrackingPopup([[${order.courier}]], [[${order.trackingNumber}]])">
          배송조회
        </button>
      </div>
    </div>
  </div>

  <div th:with="start=${(orders.number/maxPage)*maxPage + 1}, end=(${(orders.totalPages == 0) ? 1 : (start + (maxPage - 1) < orders.totalPages ? start + (maxPage - 1) : orders.totalPages)})" >
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${orders.number eq 0} ? 'disabled' : '' ">
        <a th:href="@{'/orders/' + ${orders.number-1}}" aria-label="Previous" class="page-link">
          <span aria-hidden="true">Previous</span>
        </a>
      </li>

      <li class="page-item" th:each="page:${#numbers.sequence(start, end)}"
          th:classappend="${orders.number eq page-1} ? 'active' : '' ">
        <a th:href="@{'/orders/' + ${page-1}}" th:inline="text" class="page-link">[[${page}]]</a>
      </li>

      <li class="page-item" th:classappend="${orders.number+1 ge orders.totalPages}?'disabled':''">
        <a th:href="@{'/orders/' + ${orders.number+1}}" aria-label="Next" class="page-link">
          <span aria-hidden="true">Next</span>
        </a>
      </li>
    </ul>
  </div>
</div>
</html>
